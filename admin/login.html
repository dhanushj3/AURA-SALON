<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aura Salon | Admin Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="brand">
            <h1>AURA</h1>
            <p>SALON</p>
            <span>BEAUTY • STYLE • ELEGANCE</span>
        </div>

        <div class="divider">
            <span></span>
            <b>✦</b>
            <span></span>
        </div>

        <p class="login-label">ADMINISTRATION</p>

        <h2>Welcome Back</h2>

        <p class="login-description">
            Sign in to manage Aura Salon appointments.
        </p>

        <form id="login-form">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <p id="login-message"></p>

            <button type="submit" class="login-button">
                SIGN IN
            </button>

        </form>

        <a href="../index.html" class="back-link">
            ← Back to Aura Salon
        </a>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
